name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build self-patching jar
        run: bash build-release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: HytaleOptimizer
          path: |
            build/HytaleOptimizer-*.jar
            build/HytaleOptimizer-*.jar.sha256

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See the README for install instructions."
          gh release upload "$GITHUB_REF_NAME" build/HytaleOptimizer-*.jar build/HytaleOptimizer-*.jar.sha256 --clobber
